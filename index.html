<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIVES - Didactische Coach Geschiedenis</title>
    <!-- We gebruiken marked.js om de Markdown-output van Gemini mooi op te maken in HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --vives-red: #E3004F;
            --vives-dark: #333333;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--vives-dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: var(--vives-red);
            margin-bottom: 5px;
        }
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        .card {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            color: var(--vives-dark);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="file"] {
            display: block;
            margin-top: 5px;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px dashed #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 15px;
        }
        .help-text {
            font-size: 0.9em;
            color: #555;
            display: block;
            margin-top: 8px;
            line-height: 1.4;
        }
        .help-text a {
            color: var(--vives-red);
            font-weight: bold;
            text-decoration: none;
        }
        .help-text a:hover {
            text-decoration: underline;
        }
        .info-box {
            background-color: #fff0f4;
            border-left: 4px solid var(--vives-red);
            padding: 12px;
            margin-top: 10px;
            border-radius: 0 5px 5px 0;
            font-size: 0.9em;
        }
        button {
            background-color: var(--vives-red);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #c00042;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #loading {
            display: none;
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
            color: var(--vives-red);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--vives-red);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #result-card {
            display: none;
        }
        #result-content {
            background-color: #fafafa;
            padding: 25px;
            border-radius: 5px;
            border: 1px solid #e0e0e0;
        }
        #result-content h3 {
            color: var(--vives-dark);
            margin-top: 25px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .print-btn {
            background-color: var(--vives-dark);
            margin-top: 20px;
        }
        .print-btn:hover {
            background-color: #111;
        }
    </style>
